# The live site (GitHub Pages) is published from the gh-pages branch.
# After every change to main, this copies main to gh-pages and asks Pages to rebuild.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy main to gh-pages
        run: git push --force origin HEAD:gh-pages
      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '.status'
